# ─────────────────────────────────────────────
# data.yaml
# Central data configuration for the baseball
# pitch classifier project.
# ─────────────────────────────────────────────

# Season
season:
  start: "2023-03-30"
  end:   "2023-10-01"

# Features used for classification
features:
  - release_speed         # pitch velocity (mph)
  - release_spin_rate     # spin rate (rpm)
  - pfx_x                 # horizontal movement (ft)
  - pfx_z                 # vertical movement (ft)
  - release_pos_x         # horizontal release point (ft)
  - release_pos_z         # vertical release point (ft)
  - plate_x               # horizontal location at plate (ft)
  - plate_z               # vertical location at plate (ft)
  - release_extension     # extension toward plate (ft)
  - p_throws              # pitcher handedness (0=L, 1=R)
  - spin_axis             # spin axis angle (degrees)

# Target variable
target: "pitch_type"

# Pitch type filtering
filtering:
  min_pitch_count: 50
  exclude_pitch_types:
    - "UN"
    - "PO"
    - "IN"
    - ""
    - "EP"    # eephus — novelty pitch, too rare and not representative
    - "FO"    # forkball — nearly extinct in modern MLB
    - "FA"    # generic fastball — ambiguous/miscategorized
    - "SV"    # screwball — extremely rare
    - "CS"
    - "KN"
    - "SC"

sampling:
  n_per_class: 10000

# Train/test split
split:
  test_size:    0.2
  random_state: 1
  stratify:     true

# HPO validation strategy
hpo_validation:
  strategy: kfold       # "kfold" or "fixed_split"
  n_folds:  5           # used only when strategy is kfold
  val_size: 0.2         # used only when strategy is fixed_split

# Paths
paths:
  raw_dir:       "data/raw"
  processed_dir: "data/processed"
  logs_dir:      "logs"
