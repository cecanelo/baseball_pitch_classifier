# ─────────────────────────────────────────────
# model_dt.yaml
# Decision Tree configuration + HPO
# ─────────────────────────────────────────────

model:
  name: decision_tree
  params:
    max_depth:    10
    random_state: 42

hpo:
  enabled:  false
  n_trials: 50
  metrics:
    primary:   f1_weighted
    secondary: accuracy
  search_space:
    max_depth:
      type: int
      low:  3
      high: 20
    min_samples_split:
      type: int
      low:  2
      high: 20
    min_samples_leaf:
      type: int
      low:  1
      high: 10
    criterion:
      type:    categorical
      choices: ["gini", "entropy"]

output:
  save_model:              true
  save_metrics:            true
  save_confusion_matrix:   true
  save_feature_importance: true

paths:
  models_dir:  "results/models"
  metrics_dir: "results/metrics"
  figures_dir: "results/figures"
  logs_dir:    "logs"
